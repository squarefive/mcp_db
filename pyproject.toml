[project]
name = "mcp-db"
version = "0.1.0"
description = "MCP tools for pulling and querying HarmonyOS SQLite databases."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

